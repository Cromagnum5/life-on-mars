<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browser-based real-time strategy game set on Mars."
    />
    <title>Life on Mars</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Life on Mars game view"></canvas>
      <header class="title-card">
        <p class="eyebrow">Ares Development Zone</p>
        <h1>Life on Mars</h1>
      </header>
      <aside class="controls" aria-label="Camera controls">
        <span>Move</span><kbd>WASD</kbd>
        <span>Zoom</span><kbd>Wheel</kbd>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
