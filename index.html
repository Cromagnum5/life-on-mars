<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browser-based real-time strategy game set on Mars."
    />
    <title>Life on Mars</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Life on Mars game view"></canvas>
      <header class="title-card">
        <p class="eyebrow">Ares Development Zone</p>
        <h1>Life on Mars</h1>
      </header>
      <aside class="operations" aria-label="Colony operations">
        <p class="panel-title">Corporate operations</p>
        <dl class="resource-grid">
          <dt>Power reserve</dt>
          <dd id="power-value">120 MWh</dd>
          <dt>Extracted ore</dt>
          <dd id="resource-value">250 t</dd>
          <dt>Rigwalkers</dt>
          <dd id="unit-value">1</dd>
          <dt>Selected</dt>
          <dd id="selection-value">None</dd>
        </dl>
        <div class="production-status">
          <div>
            <span>Assembly Bay</span>
            <strong id="production-value">00:30</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="production-bar"></span>
          </div>
        </div>
      </aside>
      <aside class="controls" aria-label="Camera controls">
        <span>Move</span><kbd>WASD</kbd>
        <span>Zoom</span><kbd>Wheel</kbd>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
